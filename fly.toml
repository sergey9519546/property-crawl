# fly.toml — Property-Crawl production container
# $0-capable path uses Dockerfile.production (Next UI + listing API, PORT=3000).
# Note: Fly free tier may require card verification; prefer Koyeb/Render for $0.
#
# Operator surfaces (unlock, document-review, hunts, scrapers run) require
# SCRAPER_ADMIN_TOKEN (or PROPERTY_OPERATOR_SECRET) as a Fly secret:
#   fly secrets set SCRAPER_ADMIN_TOKEN=<strong-random>
# Durable local cache (document reviews, live overlays, form leads) requires
# a volume mounted at /app/.cache — create it once:
#   fly volumes create property_cache --size 1 --region ams

app = 'property-crawl'
primary_region = 'ams'

[build]
  dockerfile = 'Dockerfile.production'

[env]
  NODE_ENV = 'production'
  PORT = '3000'
  SCRAPER_BACKGROUND_ENABLED = '0'
  PROPERTY_LIVE_CACHE_PATH = '/app/.cache/live-listings.json'
  PROPERTY_DOCUMENT_REVIEW_STORE_PATH = '/app/.cache/document-review-store.json'
  # Set via `fly secrets set`, not here:
  # SCRAPER_ADMIN_TOKEN=
  # PROPERTY_OPERATOR_SECRET=   (alias)

[[mounts]]
  source = 'property_cache'
  destination = '/app/.cache'

[http_service]
  internal_port = 3000
  force_https = true
  # Keep one machine warm when operator workspace is in use. Scale-to-zero
  # is allowed for public browse only; pair with the volume above if reviews
  # must survive stop/start without a PostgreSQL DATABASE_URL.
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '20s'
    method = 'GET'
    path = '/api/health'

[[vm]]
  # Fly expects memory_mb; remove the conflicting memory key.
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024

