services:
  - type: web
    name: property-crawl
    env: docker
    dockerfilePath: ./Dockerfile.production
    plan: free
    region: oregon
    # $0 demo deploy uses liveness. Advanced discovery readiness
    # (/api/health/ready) stays 503 without PostgreSQL + migrations.
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SCRAPER_BACKGROUND_ENABLED
        value: "0"
      - key: PORT
        value: "3000"
      # Optional for $0 demo (in-memory seed inventory). Required later for
      # durable discovery / Migration 014 canaries.
      - key: DATABASE_URL
        sync: false
      # Code reads SCRAPER_ADMIN_TOKEN; PROPERTY_OPERATOR_SECRET is accepted
      # as an alias (see server/security/operator-token.js).
      - key: SCRAPER_ADMIN_TOKEN
        generateValue: true
        sync: false
      - key: PROPERTY_OPERATOR_SECRET
        generateValue: true
        sync: false
      - key: WORKSPACE_SESSION_SECRET
        generateValue: true
        sync: false
      # Honest form delivery: leave unset for local persistence only.
      - key: NEWSLETTER_ENDPOINT
        sync: false
      - key: CONTACT_ENDPOINT
        sync: false
