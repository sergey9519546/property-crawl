services:
  - type: web
    name: property-crawl
    env: docker
    dockerfilePath: ./Dockerfile.production
    plan: free
    region: oregon
    # $0 demo deploy uses liveness. Advanced discovery readiness
    # (/api/health/ready) stays 503 without PostgreSQL + migrations.
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SCRAPER_BACKGROUND_ENABLED
        value: "1"
      - key: PORT
        value: "3000"
      - key: AUTO_MIGRATE
        value: "1"
      - key: DISCOVERY_MODE
        value: "advanced"
      # Live inventory is external PostgreSQL. Do not set PROPERTY_DB.
      # DATABASE_URL must name an existing database on PostgreSQL 16
      # (14+ can boot; postgis/postgis:16-3.4 is the server this schema runs on).
      # The role needs CONNECT, CREATE on the database, and USAGE plus CREATE
      # on schema public, which must be on search_path. It also needs
      # SELECT, INSERT, UPDATE, and DELETE. AUTO_MIGRATE installs postgis,
      # uuid-ossp, pg_trgm, and pgcrypto, then applies schema.sql and
      # migrations 003-029 into public. Use the Render internal hostname.
      # An external hostname also needs ?sslmode=require.
      # sync: false keeps the live value.
      - key: DATABASE_URL
        sync: false
      # Code reads SCRAPER_ADMIN_TOKEN; PROPERTY_OPERATOR_SECRET is accepted
      # as an alias (see server/security/operator-token.js). Do NOT
      # generateValue both independently — they must be the same secret or
      # only the primary set; otherwise unlock/API can diverge.
      - key: SCRAPER_ADMIN_TOKEN
        generateValue: true
        sync: false
      - key: PROPERTY_OPERATOR_SECRET
        sync: false
      - key: WORKSPACE_SESSION_SECRET
        generateValue: true
        sync: false
      - key: WORKSPACE_SESSION_EPOCH
        value: "1"
      # Behind Render's proxy, key rate limits on client IP from XFF.
      - key: TRUSTED_PROXY_COUNT
        value: "1"
      # Honest form delivery: leave unset for local persistence only.
      - key: NEWSLETTER_ENDPOINT
        sync: false
      - key: CONTACT_ENDPOINT
        sync: false
      # Public App and Smoke Origins
      - key: PUBLIC_APP_ORIGIN
        sync: false
      - key: DEPLOY_SMOKE_URL
        sync: false
      # Stripe Payments & Webhooks (Pillar 6)
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PRICE_ID
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      # Zyte / Scrapy Cloud Webhook Ingest Secret
      - key: SCRAPY_INGEST_SECRET
        sync: false
