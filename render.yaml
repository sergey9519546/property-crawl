services:
  - type: web
    name: property-crawl
    env: docker
    dockerfilePath: ./Dockerfile.production
    plan: free
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SCRAPER_BACKGROUND_ENABLED
        value: "0"
      - key: DATABASE_URL
        sync: false
