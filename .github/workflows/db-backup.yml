name: Database Backup / R2 Off-Host Archive

on:
  schedule:
    - cron: '17 8 * * *'
  workflow_dispatch:

jobs:
  pg-backup-r2:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify backup target configuration
        id: config
        env:
          DATABASE_DIRECT_URL: ${{ secrets.DATABASE_DIRECT_URL }}
        run: |
          if [ -z "$DATABASE_DIRECT_URL" ]; then
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              echo "::error::DATABASE_DIRECT_URL secret is not configured. Configure DATABASE_DIRECT_URL, R2_BUCKET, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, and R2_ENDPOINT in repository secrets."
              exit 1
            fi
            echo "DATABASE_DIRECT_URL secret is not configured — skipping scheduled off-host backup."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Install postgresql-client
        if: ${{ steps.config.outputs.ready == 'true' }}
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Export PostgreSQL dump and upload to R2
        if: ${{ steps.config.outputs.ready == 'true' }}
        env:
          DATABASE_DIRECT_URL: ${{ secrets.DATABASE_DIRECT_URL }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: node scripts/export-hosted-backup.js --upload-r2
