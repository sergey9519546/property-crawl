name: Scheduled Property Ingestion Scraper

on:
  schedule:
    - cron: '0 */6 * * *' # Every 6 hours
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write  # push the refreshed data.js back to the repo
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Regenerate listing corpus from live scrapers
        env:
          RUN_REAL_SCRAPERS: '1'
        run: npm run refresh-data:real

      - name: Commit refreshed data.js (if changed)
        run: |
          git config user.name "property-crawl-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.js
          if git diff --cached --quiet; then
            echo "No listing changes"
          else
            git commit -m "chore(data): refresh listings from live scrapers [skip ci]"
            git push
          fi

      - name: Sync Refreshed Listings to Production Database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -n "${DATABASE_URL}" ]; then
            npm run db:import:prune
          else
            echo "DATABASE_URL not configured; skipping database import and prune"
          fi

      - name: Trigger Production Scraper Run
        env:
          PRODUCTION_APP_URL: ${{ secrets.PRODUCTION_APP_URL || 'https://property-crawl.vercel.app' }}
          SCRAPER_ADMIN_TOKEN: ${{ secrets.SCRAPER_ADMIN_TOKEN }}
        run: |
          # Trigger backend scraper refresh when configured
          curl -sSf "${PRODUCTION_APP_URL}/api/health" > /dev/null 2>&1 || echo "Wakeup ping dispatched"
          if [ -n "${SCRAPER_ADMIN_TOKEN}" ]; then
            curl -s --max-time 55 -X POST "${PRODUCTION_APP_URL}/api/scrapers/run?wave=wave1" \
              -H "x-scraper-token: ${SCRAPER_ADMIN_TOKEN}" || echo "Production wave1 trigger skipped or timed out"
            curl -s --max-time 55 -X POST "${PRODUCTION_APP_URL}/api/scrapers/run?wave=wave2" \
              -H "x-scraper-token: ${SCRAPER_ADMIN_TOKEN}" || echo "Production wave2 trigger skipped or timed out"
          fi
