name: CI / Verification Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # Fail-closed unit/security gate — no PostgreSQL, no Playwright.
  # This is the $0 release gate that must stay green.
  unit-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Context drift
        run: node scripts/gen-context.js --check
      - name: Schema mirror sync
        run: node scripts/sync-schema-mirror.js --check
      - name: Production smoke contract
        run: node scripts/production-smoke.js
      - name: Promotion gate contract
        run: npm run promotion:gate
      - name: Quality gate report
        run: npm run quality:report
      # The guards about the guards, and they must be BLOCKING.
      #
      # Until this step existed, the only CI job that ran `npm test` was
      # extended-suite, which carries continue-on-error: true. Every regression
      # guard in the repo therefore lived in a job whose failure was discarded,
      # and deploy.yml gates on workflow_run.conclusion == 'success' -- which
      # is satisfied when extended-suite fails. The gate that certifies "CI
      # covers every test file" could not fail CI.
      #
      # This set needs no database, no browser and no network (814ms locally),
      # so there is no reason for it to be advisory.
      - name: Verification meta-guards (blocking)
        run: npm run test:meta-guards
      - name: Foolproof scrape contracts
        run: npm run test:foolproof-p0
      - name: Scraper power / end coverage
        run: npm run test:scraper-power
      # The only direct test of scripts/crawlers/scrapling_extract.py. It was
      # never executed by anything: no test:* script ran it, and no CI step did
      # either, so 16 parser tests guarded a production code path by sitting in
      # the tree. It needs the pinned interpreter, because the suite asserts
      # engineVersion == the version in scripts/crawlers/requirements.txt and
      # the runner must be the one defaultPython() resolves. This job is the
      # blocking one, so the parser is finally checked where a failure counts.
      - name: Setup Python for the pinned Scrapling parser
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Scrapling parser suite (pinned runtime)
        run: |
          python -m venv .cache/crawler-tools/venv
          .cache/crawler-tools/venv/bin/pip install --quiet --upgrade pip
          .cache/crawler-tools/venv/bin/pip install --quiet -r scripts/crawlers/requirements.txt
          npm run test:scrapling-parser
      - name: Production build
        run: npm run build
      - name: Production boot + user workflow e2e (demo-pinned)
        env:
          DATABASE_URL: ""
          DISCOVERY_MODE: ""
        run: |
          if [ ! -f .env.local ]; then
            printf 'SCRAPER_ADMIN_TOKEN=ci-e2e-operator-token\nPROPERTY_API_URL=http://127.0.0.1:3002\n' > .env.local
          elif ! grep -q '^SCRAPER_ADMIN_TOKEN=' .env.local; then
            printf 'SCRAPER_ADMIN_TOKEN=ci-e2e-operator-token\n' >> .env.local
          fi
          node scripts/run-production-e2e.js

  # Extended suite — may require optional env (DISCOVERY_TEST_DATABASE_URL,
  # Playwright browsers). Failure here does not block demo $0 release.
  extended-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    continue-on-error: true
    needs: unit-gate
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Setup Python (Playwright)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Install Playwright + Chromium
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install --with-deps chromium
      - name: Full npm test (discovery suites skip without PG)
        run: npm test
        env:
          NODE_ENV: test

  # PostgreSQL-backed production e2e — document-review store=postgres path.
  production-e2e-pg:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: unit-gate
    continue-on-error: true
    services:
      postgres:
        image: postgis/postgis:16-3.4-alpine
        env:
          POSTGRES_USER: property
          POSTGRES_PASSWORD: property-local-dev
          POSTGRES_DB: property_crawl
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U property -d property_crawl"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Production build
        run: npm run build
      - name: Apply schema + run e2e with PostgreSQL
        env:
          DATABASE_URL: postgres://property:property-local-dev@127.0.0.1:55432/property_crawl
          DISCOVERY_MODE: advanced
        run: |
          node -e "const {Pool}=require('pg');const fs=require('fs');const p=new Pool({connectionString:process.env.DATABASE_URL});p.query(fs.readFileSync('server/db/schema.sql','utf8')).then(()=>p.end()).catch(e=>{console.error(e);process.exit(1)});"
          printf 'SCRAPER_ADMIN_TOKEN=ci-e2e-operator-token\nPROPERTY_API_URL=http://127.0.0.1:3002\n' > .env.local
          node scripts/run-production-e2e.js --with-db
      - name: Live PostgreSQL contract suite (db.test.js round-trip)
        env:
          DATABASE_URL: postgres://property:property-local-dev@127.0.0.1:55432/property_crawl
        run: node test/db.test.js
