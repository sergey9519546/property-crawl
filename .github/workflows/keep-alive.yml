name: Keep-Alive Heartbeat

on:
  # Disabled scheduled 24/7 pinging so serverless/free-tier quotas aren't burned
  # on idle heartbeats; invoke manually if keeping a stateful free container warm.
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping Production Healthcheck
        run: |
          TARGET_URL="${{ secrets.PRODUCTION_APP_URL || 'https://property-crawl-api.vercel.app' }}/api/health"
          echo "Pinging $TARGET_URL to verify liveness..."
          curl -fsS --max-time 15 "$TARGET_URL" > /dev/null || echo "Health ping dispatched"
